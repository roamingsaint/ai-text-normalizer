name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: .\build.ps1

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash .\release\AITextNormalizer.exe -Algorithm SHA256
          "$($hash.Hash) *AITextNormalizer.exe" | Set-Content -Path .\release\AITextNormalizer.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITextNormalizer-windows
          path: |
            release/AITextNormalizer.exe
            release/AITextNormalizer.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AITextNormalizer.exe
            release/AITextNormalizer.exe.sha256
          generate_release_notes: true
