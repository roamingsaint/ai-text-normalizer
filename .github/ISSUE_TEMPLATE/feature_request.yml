name: Feature request
description: Suggest an improvement for AI Text Normalizer
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other options you thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or workflow details.
